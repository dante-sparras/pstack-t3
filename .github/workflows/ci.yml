name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  PSTACK_TEST_REAL_PROCESS: '1'
  TMPDIR: /tmp

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  part_310:
    name: part (3.10, ${{ matrix.part }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      - run: python3 scripts/run_tests.py --part ${{ matrix.part }}/8

  part_312:
    name: part (3.12, ${{ matrix.part }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/run_tests.py --part ${{ matrix.part }}/8

  test_310:
    name: test (3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [part_310, browser_linux, generated]
    if: always()
    steps:
      - run: |
          case "$GITHUB_EVENT_NAME" in
            push) linux=skipped ;;
            pull_request) linux=success ;;
            *) exit 1 ;;
          esac
          test "${{ needs.part_310.result }}" = "$linux"
          test "${{ needs.browser_linux.result }}" = "$linux"
          test "${{ needs.generated.result }}" = success

  test_312:
    name: test (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [part_312, browser_linux, generated, browser_macos, macos_312]
    if: always()
    steps:
      - run: |
          case "$GITHUB_EVENT_NAME" in
            push) linux=skipped; macos=success ;;
            pull_request) linux=success; macos=skipped ;;
            *) exit 1 ;;
          esac
          test "${{ needs.part_312.result }}" = "$linux"
          test "${{ needs.browser_linux.result }}" = "$linux"
          test "${{ needs.macos_312.result }}" = "$macos"
          test "${{ needs.browser_macos.result }}" = "$macos"
          test "${{ needs.generated.result }}" = success

  generated:
    name: generated files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Generated skills match the sources
        run: |
          python3 scripts/build.py
          git diff --exit-code -- skills docs/skills.md docs/cli
          test -z "$(git status --porcelain -- skills docs/skills.md docs/cli)"

  browser_linux:
    name: browser (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - &select_browser
        run: |
          set -e
          browser=$(python3 - <<'PY'
          import sys
          import tempfile
          from tests.test_activity_render import select_browser
          with tempfile.TemporaryDirectory(ignore_cleanup_errors=True) as directory:
              path, unavailable = select_browser(directory)
          if path is None:
              print("no working headless browser: " + "; ".join(unavailable), file=sys.stderr)
              with tempfile.TemporaryDirectory(ignore_cleanup_errors=True) as directory:
                  path, unavailable = select_browser(directory, timeout=60)
          if path is None:
              print("no working headless browser: " + "; ".join(unavailable))
              raise SystemExit(1)
          print(path)
          PY
          ) || { printf '%s\n' "$browser"; exit 1; }
          printf '%s\n' "$browser"
          "$browser" --version

  browser_macos:
    name: browser (macOS)
    runs-on: macos-latest
    timeout-minutes: 10
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - *select_browser

  macos_312:
    name: macOS (3.12, ${{ matrix.part }}/4)
    runs-on: macos-latest
    timeout-minutes: 45
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Test part ${{ matrix.part }}/4
        run: |
          log="$RUNNER_TEMP/macos-312.txt"
          : > "$log"
          status=0
          python3 scripts/run_tests.py --part ${{ matrix.part }}/4 >> "$log" 2>&1 || status=1
          cat "$log" || true
          {
            grep -E '^Ran [0-9]+ tests? in ' "$log" || true
            grep -E '^(OK|FAILED)' "$log" || true
            grep -E '^(FAIL|ERROR): ' "$log" || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
